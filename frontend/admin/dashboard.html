<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Dashboard • Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Resultados de encuestas</h1>
    <div>
      <a class="secondary" href="./create.html">+ Nueva encuesta</a>
      <span id="who" class="hint"></span>
      <button id="btnLogout" class="secondary">Salir</button>
    </div>
  </header>

  <div id="polls" class="polls"></div>

  <script src="../auth/session.js"></script>
  <script src="./dashboard.js"></script>
  <script>
    // Gate admin + mostrar nombre
    const s = Auth.requireRole('admin');
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelector('#who').textContent = s.user?.name || s.user?.email;
    });
  </script>
</body>
</html>
