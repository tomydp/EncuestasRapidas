<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Encuestas • Votar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <!-- Usuario + salir: fijo arriba derecha -->
  <div class="user-actions">
    <span id="who" class="hint"></span>
    <button id="btnLogout" class="secondary">Salir</button>
  </div>

  <!-- Título centrado -->
  <h1 class="page-title">Encuestas activas</h1>

  <div class="search-row">
    <input id="search" type="text" placeholder="Buscar por pregunta..." />
    <button id="btnSearch" type="button">Buscar</button>
    <button id="btnReload" type="button" class="secondary">Recargar</button>
  </div>

  <div id="pollsList" class="polls"></div>

  <div id="toast"></div>

  <script src="../auth/session.js"></script>
  <script src="../mock-api.js"></script> <!-- quitar cuando uses backend real -->
  <script src="../seed-demo.js"></script>  <!-- solo para desarrollo -->
  <script src="./app.js"></script>

</html>
